# Netlify Configuration for Fork & Knife Website
# Automatically configures build settings when importing the repository on Netlify

[build]
  command = "npm run build"
  publish = "dist"

# Single-page application redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Recommended Node.js runtime environment
[build.environment]
  NODE_VERSION = "20"
